<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送 JSON 到後端</title>
    <link rel="stylesheet" href="./Form.css" />
</head>
<body>
    <div>
        <div>品牌名稱：<input type="text" id="BrandName" placeholder="請輸入品牌名稱"></div>
        <div>公司名稱：<input type="text" id="CompanyName" placeholder="請輸入公司名稱"></div>
    </div>
    <div>
        <div>上線日期：<input type="text" id="date" placeholder="請輸入上線日期"></div>
        <div>上線人員：<input type="text" id="personnel" placeholder="請輸入上線人員名稱"></div>
    </div>
    <div>
        <div>門市名稱：<input type="text" id="StoreName" placeholder="請輸入門市名稱"></div>
        <div>門市代號：<input type="text" id="StoreNumber" placeholder="請輸入門市代號"></div>
    </div>
    <button type="button" class="button">確認送出</button>
    <script src="./pageA.js"></script>
</body>
</html>
