<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>門市軟體上線檢核表</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>

  <div class="Checklist">
    <table class="print-container">
      <thead>
        <tr>
          <td>
            <div class="title">
              <img src="./圖片1.png" class="title-icon" />
              <h1>門市軟體上線檢核表</h1>
            </div>
          </td>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <div class="Checklist-table">
              <table border="1" class="table-full">
                <tr>
                  <td class="label-cell">品牌名稱</td> 
                  <td class="content-cell" id="BrandName"></td><!--BrandName-->
                  <td class="label-cell">客戶公司名稱</td>
                  <td class="content-cell" id="CompanyName"></td><!--CompanyName-->
                </tr>
                <tr>
                  <td class="label-cell">上線日期</td>
                  <td class="content-cell" id="date"></td><!--date-->
                  <td class="label-cell">上線人員</td>
                  <td class="content-cell" id="personnel"></td><!--personnel-->
                </tr>
                <tr>
                  <td class="label-cell">門市名稱</td>
                  <td class="content-cell" id="StoreName"></td><!--StoreName-->
                  <td class="label-cell">門市店號</td>
                  <td class="content-cell" id="StoreNumber"></td><!--StoreNumber-->
                </tr>
              </table>

              <table class="table-full table-v">
                <tr>
                  <td class="label" rowspan="3">版本紀錄</td>
                  <td class="content-name">POS</td>
                  <td class="content-val" id="POSVersion"></td> <!--POSVersion-->
                  <td class="content-name">傳輸接單</td>
                  <td class="content-val" id="TransferSweborderVersion"></td> <!--Transfer&weborderVersion-->
                </tr>
                <tr>
                  <td class="content-name">KIOSK apk</td>
                  <td class="content-val" id="KIOSKVersion"></td> <!--KIOSKVersion-->
                  <td class="content-name">AppTableServer</td>
                  <td class="content-val" id="ApptableVersion"></td> <!--APPtableVersion-->
                </tr>
                <tr>
                  <td class="content-name">平板點餐apk</td>
                  <td class="content-val" id="orderingApkVersion"></td> <!--orderingApkVersion-->
                  <td class="content-name">客顯輪播圖片路徑</td>
                  <td class="content-val" id="customerDisplayPath"></td><!--customerDisplayPath-->
                </tr>
              </table>

              <table class="table-full item-table">
                <tr class="header-row">
                  <td class="scope">範圍</td>
                  <td class="detail">設定檢核內容</td>
                  <td class="label-cell2">備註</td>
                </tr>
                
                <tr>
                  <td class="POS-header" rowspan="1">License</td>
                  <td class="POS-content">
                    <div class="checkbox-item"><input type="checkbox" id="check1" /><label for="check1">POS 軟體是否可打開，正常運作</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="check2" /><label for="check2">POS 點餐畫面商店名稱(左上角)是否正確</label></div>
                  </td>
                  <td class="empty-cell"></td>
                </tr>

                <tr>
                  <td class="POS-header">POS基本設定</td>
                  <td class="POS-content">
                    <div class="checkbox-item">
                      <input type="checkbox" id="check3" /><label for="check3">店號</label>
                      <input type="checkbox" id="check4" /><label for="check4">機號</label>
                      <input type="checkbox" id="check5" /><label for="check5">菜單內容與價格確認</label>
                    </div>
                    <div class="checkbox-item"><input type="checkbox" id="check6"/><label for="check6">POS發票抬頭 – LOGO / 文字 (請擇一圈選)</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="check7" /><label for="check7">KIOSK 發票抬頭 – 文字</label></div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="check8"/>
                        <label for="check8">桌況-
                            <span id="labelConfirmed" class="status-pill">已確認</span> / 
                            <span id="labelNoTable" class="status-pill">無桌況</span>
                        </label>
                        <input type="checkbox" id="check9" /><label for="check9">加入Teamviewer名單</label>
                    </div>
                  </td>
                  <td class="empty-cell"></td>
                </tr>

                <tr>
                  <td class="POS-header">傳輸接單</td>
                  <td class="POS-content">
                    <div class="checkbox-item">
                        <input type="checkbox" id="check10"/>
                        <label for="check10">傳輸/接單設定方式：
                            <span id="Separate" class="status-pill">分開</span> / 
                            <span id="Together" class="status-pill">統一</span>
                        </label>
                        <input type="checkbox" id="check11" /><label for="check11">加入Teamviewer名單</label>
                    </div>
                    <div class="checkbox-item">
                      <input type="checkbox" id="check12" /><label for="check12">傳輸程式正常</label>
                      <input type="checkbox" id="check13" /><label for="check13">接單程式正常</label></div>
                  </td>
                  <td class="empty-cell"></td>
                </tr>

                <tr>
                  <td class="POS-header">排程</td>
                  <td class="POS-content">
                    <div class="checkbox-item">
                      <input type="checkbox" id="check14" /><label for="check14">DBBackup</label>
                      <input type="checkbox" id="check15" /><label for="check15">電子發票</label>
                    </div>
                    <div class="checkbox-item">
                      <input type="checkbox" id="check16" /><label for="check16">會員點數</label>
                      <input type="checkbox" id="check17" /><label for="check17">票券</label>
                    </div>
                  </td>
                  <td class="empty-cell"></td>
                </tr>

                <tr>
                  <td class="POS-header">平板</td>
                  <td class="POS-content">
                    <div class="checkbox-item">
                      <input type="checkbox" id="check18" /><label for="check18">平板授權設定</label>
                      <input type="checkbox" id="check19" /><label for="check19">加入Teamviewer名單</label>
                    </div>
                  </td>
                  <td class="empty-cell"></td>
                </tr>

                <tr>
                  <td class="POS-header">KIOSK</td>
                  <td class="POS-content">
                    <div class="checkbox-item">
                      <input type="checkbox" id="check20" /><label for="check20">Autykey設定</label>
                      <input type="checkbox" id="check21" /><label for="check21">店號設定</label>
                      <input type="checkbox" id="check22" /><label for="check22">加入Teamviewer名單</label>
                    </div>
                    <div class="checkbox-item"><input type="checkbox" id="check23" /><label for="check23">菜單/價格/圖片(商品圖片/LOGO/輪播圖)確認</label></div>
                  </td>
                  <td class="empty-cell"></td>
                </tr>

                <tr>
                  <td class="POS-header">UniKDS</td>
                  <td class="POS-content">
                    <div class="checkbox-item"><input type="checkbox" id="check24" /><label for="check24">FindTbox IP 是否正確</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="check25" /><label for="check25">POS中KDS設定IP是否與FindTbox中相同</label></div>
                    <div class="checkbox-item">是否使用電視：
                      <input type="checkbox" id="check26" /><label for="check26">否</label>
                      <input type="checkbox" id="check27" /><label for="check27">是，Uni叫號 / XSign叫號</label>
                    </div>
                    <div class="checkbox-item">
                      <input type="checkbox" id="check28" /><label for="check28">若使用XSign : </label>
                      <input type="checkbox" id="check29" /><label for="check29">勾選使用Tbox</label>
                      <input type="checkbox" id="check30" /><label for="check30">客顯URL</label>
                    </div>
                  </td>
                  <td class="empty-cell"></td>
                </tr>

                <tr>
                  <td class="POS-header">XSign叫號機</td>
                  <td class="POS-content">
                    <div class="checkbox-item">
                      <input type="checkbox" id="check31" /><label for="check31">傳送安裝檔與資料檔</label>
                      <input type="checkbox" id="check32" /><label for="check32">XSign電視機器碼綁定</label>
                    </div>
                    <div class="checkbox-item">
                      <input type="checkbox" id="check33" /><label for="check33">BenQTTSDemo 設定</label>
                      <input type="checkbox" id="check34" /><label for="check34">d/node.js 設定</label>
                    </div>
                    <div class="checkbox-item">
                      <input type="checkbox" id="check35" /><label for="check35">KDSReader 設定</label>
                      <input type="checkbox" id="check36" /><label for="check36">加入Teamviewer名單</label>
                    </div>
                  </td>
                  <td class="empty-cell"></td>
                </tr>

                <tr>
                  <td class="POS-header">叫號機</td>
                  <td class="POS-content">
                    <div class="checkbox-item">
                      <input type="checkbox" id="check37" /><label for="check37">傳送UniKDS apk</label>
                      <input type="checkbox" id="check38" /><label for="check38">安裝UniKDS apk</label>
                    </div>
                    <div class="checkbox-item">
                      <input type="checkbox" id="check39" /><label for="check39">勾選使用Tbox、訂單叫號</label>
                      <input type="checkbox" id="check40" /><label for="check40">變更UniKDS角色</label>
                    </div>
                    <div class="checkbox-item"><input type="checkbox" id="check41" /><label for="check41">顯示風格輸入CallingMode tv</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="check42" /><label for="check42">加入Teamviewer名單</label></div>
                  </td>
                  <td class="empty-cell"></td>
                </tr>

                <tr>
                  <td class="POS-header"></td>
                  <td class="POS-content"><div class="checkbox-item"><input type="checkbox" id="check43" /><label for="check43">null</label></div></td>
                  <td class="empty-cell"></td>
                </tr>
                <tr>
                  <td class="POS-header"></td>
                  <td class="POS-content"><div class="checkbox-item"><input type="checkbox" id="check44" /><label for="check44">null</label></div></td>
                  <td class="empty-cell"></td>
                </tr>
              </table>
            </div>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>
            <footer class="form-footer">
              <div class="footer-left">
                表單編號：WiXtar-SF-007　版序：V01
              </div>
              <div class="footer-center">
                第 <span class="current-page">1</span> 頁，共 <span class="total-pages">1</span> 頁
              </div>
              <div class="footer-right">
                實施日期：2024/07/30
              </div>
              </footer>
            </footer>
          </td>
        </tr>
      </tfoot>
      <!---第二頁--->
    </table>
    <script src="./pageB.js"></script>
  </div>
</body>
</html>
